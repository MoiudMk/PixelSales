workflows:
  pixelsales-android:
    name: PixelSales Android APK
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: "com.pixel.pixelsales"
    scripts:
      - name: Generate android platform folder
        script: |
          set -e
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name pixelsales --org com.pixel .
          fi
          echo "Checking android folder was created:"
          ls -la android
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
        ignore_failure: true
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

  pixelsales-web:
    name: PixelSales Web Preview
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build Web
        script: flutter build web --release
    artifacts:
      - build/web/**
