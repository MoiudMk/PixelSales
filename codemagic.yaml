workflows:
  android-workflow:
    name: PixelSales Android APK
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Generate Android project if needed
        script: |
          if [ ! -d android ]; then
            rm -rf /tmp/pixelsales_android
            flutter create --platforms=android --project-name pixelsales /tmp/pixelsales_android
            cp -R /tmp/pixelsales_android/android .
          fi
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
